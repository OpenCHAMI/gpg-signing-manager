name: Test signing scripts

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  shellcheck:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y shellcheck

      - name: Run shellcheck on all scripts
        run: |
          shellcheck -x scripts/*.sh test/integration-test.sh

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnupg2

      - name: Run integration test suite
        run: bash test/integration-test.sh

      # Upload artifacts from the test run so failures can be diagnosed.
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: /tmp/gpg-integration-*
          if-no-files-found: ignore
          retention-days: 3
