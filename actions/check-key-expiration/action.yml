name: 'Check key expiration'
description: 'Fails if imported signing secret material is expired or expiring soon'

inputs:
  key-armored-b64:
    description: 'Base64-encoded armored secret key export'
    required: true
  secret-name:
    description: 'Expected GitHub secret name for key-armored-b64'
    required: false
    default: 'GPG_REPO_KEY_B64'
  legacy-secret-name:
    description: 'Legacy secret name accepted by older workflows'
    required: false
    default: 'GPG_SUBKEY_B64'
  warn-days:
    description: 'Number of days before expiry that should fail the action'
    required: false
    default: '30'

runs:
  using: 'composite'
  steps:
    - name: Install GnuPG
      shell: bash
      run: |
        if command -v gpg >/dev/null 2>&1; then
          exit 0
        fi

        if command -v sudo >/dev/null 2>&1; then
          SUDO=sudo
        else
          SUDO=
        fi

        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update
          $SUDO apt-get install -y gnupg2
        elif command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y gnupg2
        else
          echo 'Unsupported package manager: need apt-get or dnf' >&2
          exit 1
        fi

    - name: Check signing key expiry
      shell: bash
      env:
        KEY_ARMORED_B64: ${{ inputs.key-armored-b64 }}
        SECRET_NAME: ${{ inputs.secret-name }}
        LEGACY_SECRET_NAME: ${{ inputs.legacy-secret-name }}
        WARN_DAYS: ${{ inputs.warn-days }}
      run: |
        set -euo pipefail

        if [[ -z "${KEY_ARMORED_B64//[[:space:]]/}" ]]; then
          echo "::error::Input 'key-armored-b64' is empty. No key material was provided."
          echo "::error::Expected repo secret '${SECRET_NAME}' to contain a base64 armored secret signing key."
          echo "::notice::Repository: ${GITHUB_REPOSITORY}"
          echo "::notice::Set secret: gh secret set ${SECRET_NAME} --repo ${GITHUB_REPOSITORY} < <repo>-secret-subkeys.b64"
          echo "::notice::If you still use '${LEGACY_SECRET_NAME}', either rename it or pass it via workflow fallback."
          exit 1
        fi

        export GNUPGHOME="$(mktemp -d)"
        chmod 700 "$GNUPGHOME"
        trap 'rm -rf "$GNUPGHOME"' EXIT

        decode_log="$GNUPGHOME/decode-error.log"
        import_log="$GNUPGHOME/import-error.log"

        if ! printf '%s' "$KEY_ARMORED_B64" | base64 -d > signing-key.asc 2>"$decode_log"; then
          decode_msg="$(tr -d '\n' < "$decode_log")"
          echo "::error::Failed to decode key-armored-b64 as base64."
          [[ -n "$decode_msg" ]] && echo "::error::base64 decoder output: ${decode_msg}"
          echo "::notice::Re-export the secret payload and store it as ${SECRET_NAME}."
          exit 1
        fi

        if ! gpg --batch --import signing-key.asc >/dev/null 2>"$import_log"; then
          import_msg="$(tr -d '\n' < "$import_log")"
          echo "::error::Failed to import decoded key material into a temporary GnuPG keyring."
          [[ -n "$import_msg" ]] && echo "::error::gpg import output: ${import_msg}"
          echo "::notice::Ensure ${SECRET_NAME} contains a secret key export (not a public key)."
          exit 1
        fi

        SCRIPT_PATH="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)/scripts/check-key-expiry.sh"
        "$SCRIPT_PATH" \
          --gnupghome "$GNUPGHOME" \
          --threshold-days "$WARN_DAYS" \
          --github-annotations
