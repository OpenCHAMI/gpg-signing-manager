name: 'Check key expiration'
description: 'Fails if imported signing secret material is expired or expiring soon'

inputs:
  key-armored-b64:
    description: 'Base64-encoded armored secret key export'
    required: true
  warn-days:
    description: 'Number of days before expiry that should fail the action'
    required: false
    default: '30'

runs:
  using: 'composite'
  steps:
    - name: Install GnuPG
      shell: bash
      run: |
        if command -v gpg >/dev/null 2>&1; then
          exit 0
        fi

        if command -v sudo >/dev/null 2>&1; then
          SUDO=sudo
        else
          SUDO=
        fi

        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update
          $SUDO apt-get install -y gnupg2
        elif command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y gnupg2
        else
          echo 'Unsupported package manager: need apt-get or dnf' >&2
          exit 1
        fi

    - name: Check signing key expiry
      shell: bash
      env:
        KEY_ARMORED_B64: ${{ inputs.key-armored-b64 }}
        WARN_DAYS: ${{ inputs.warn-days }}
      run: |
        set -euo pipefail

        test -n "$KEY_ARMORED_B64"

        export GNUPGHOME="$(mktemp -d)"
        chmod 700 "$GNUPGHOME"
        trap 'rm -rf "$GNUPGHOME"' EXIT

        printf '%s' "$KEY_ARMORED_B64" | base64 -d > signing-key.asc
        gpg --batch --import signing-key.asc

        now_epoch=$(date +%s)
        warn_seconds=$(( WARN_DAYS * 86400 ))
        found=0
        failed=0
        while IFS=: read -r rec_type _ _ _ keyid _ expiry _ _ _ _ capabilities _; do
          if [ "$rec_type" != "sec" ] && [ "$rec_type" != "ssb" ]; then
            continue
          fi
          if [[ "$capabilities" != *s* ]]; then
            continue
          fi
          found=1
          if [ -z "$expiry" ] || [ "$expiry" = "0" ]; then
            echo "Signing key $keyid OK: does not expire"
            continue
          fi
          remaining=$(( expiry - now_epoch ))
          expiry_iso=$(date -u -d "@$expiry" +%Y-%m-%dT%H:%M:%SZ)
          if [ "$remaining" -le 0 ]; then
            echo "::error::Signing key $keyid is already expired (expired $expiry_iso)"
            failed=1
          elif [ "$remaining" -le "$warn_seconds" ]; then
            days_left="$(( (remaining + 86399) / 86400 ))"
            echo "::error::Signing key $keyid expires soon: $expiry_iso (${days_left} days left)"
            failed=1
          else
            days_left="$(( remaining / 86400 ))"
            echo "Signing key $keyid OK: expires $expiry_iso (${days_left} days left)"
          fi
        done < <(gpg --batch --with-colons --list-secret-keys)

        if [ "$found" -eq 0 ]; then
          echo "::error::No signing-capable secret keys found after importing secret key material"
          exit 1
        fi

        if [ "$failed" -ne 0 ]; then
          exit 1
        fi
